<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <meta name="theme-color" content="#0a0b0d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RigDeck" />
  <title>RigDeck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <video id="nosleep-video" src="/nosleep.mp4" muted loop playsinline aria-hidden="true"
    style="position:fixed; width:1px; height:1px; opacity:0; pointer-events:none;"></video>

  <header>
    <div class="brand">
      <span class="brand-mark">//</span>
      <h1>RIG<span>DECK</span></h1>
    </div>
    <div id="now-playing" class="now-playing">
      <span class="now-playing-icon">♪</span>
      <span id="now-playing-text"></span>
    </div>
    <div class="header-right">
      <div id="status" class="status">
        <span class="led"></span>
        <span id="status-text">verificando</span>
      </div>
      <button class="btn-ghost" id="toggle-fullscreen" title="Tela cheia" aria-label="Tela cheia" hidden>⛶</button>
      <button class="btn-ghost icon-only" id="toggle-edit" title="Configurar" aria-label="Configurar">⚙</button>
    </div>
  </header>

  <div id="stats" class="stats"></div>
  <div id="breadcrumb" class="breadcrumb"></div>

  <main id="grid" aria-label="Presets"></main>
  <div id="grid-dots" class="grid-dots"></div>

  <footer id="media-bar" class="media-bar">
    <button class="media-btn" data-action="PREV" title="Faixa anterior" aria-label="Faixa anterior">⏮</button>
    <button class="media-btn" data-action="PLAY_PAUSE" title="Play/Pause" aria-label="Play/Pause">⏯</button>
    <button class="media-btn" data-action="NEXT" title="Próxima faixa" aria-label="Próxima faixa">⏭</button>
    <span class="media-sep"></span>
    <button class="media-btn" data-action="VOLUME_DOWN" title="Volume -" aria-label="Diminuir volume">🔉</button>
    <button class="media-btn" data-action="VOLUME_UP" title="Volume +" aria-label="Aumentar volume">🔊</button>
    <button class="media-btn" data-action="MUTE" title="Mudo" aria-label="Mudo">🔇</button>
    <span class="media-sep"></span>
    <button class="media-btn" id="open-audio-mixer" title="Mixer de som" aria-label="Mixer de som">🎚️</button>
  </footer>

  <datalist id="programs-list"></datalist>
  <datalist id="obs-scenes-list"></datalist>

  <section id="editor">
    <div class="editor-inner">
      <h2><span class="tag">CONFIG</span> Presets</h2>
      <div class="editor-body">
        <div class="editor-col editor-col-list">
          <div class="editor-toolbar">
            <button class="btn-ghost small" id="refresh-programs">🔄 ATUALIZAR PROGRAMAS</button>
            <a class="btn-ghost small" id="export-btn" href="/api/export" download>⬇ EXPORTAR</a>
            <button class="btn-ghost small" id="import-btn">⬆ IMPORTAR</button>
            <input type="file" id="import-file" accept=".json" hidden />
          </div>
          <input id="preset-search" placeholder="🔎 Buscar preset por nome..." class="preset-search" />
          <div id="preset-list"></div>
        </div>

        <div class="editor-col editor-col-form">
          <h3 id="form-title">Novo preset</h3>
          <div class="step-row">
            <select id="item-type">
              <option value="launcher">ATALHO</option>
              <option value="folder">PASTA</option>
              <option value="fs-folder">PASTA DO DISCO</option>
            </select>
            <select id="item-parent"></select>
          </div>
          <input id="preset-name" placeholder="NOME" />
          <input id="item-icon" placeholder="Ícone (emoji opcional — Win+. abre o seletor)" maxlength="8" />
          <input id="item-fs-path" placeholder="Caminho no disco (ex: C:\Users\...\Pasta)" />
          <div class="trigger-picker">
            <input id="item-trigger-process" placeholder="Abrir esta pasta sozinho quando eu jogar/abrir... (busque pelo nome, ex: CS2)" autocomplete="off" />
            <div id="item-trigger-suggestions" class="trigger-suggestions" hidden></div>
            <div id="item-trigger-chips" class="trigger-chips"></div>
          </div>
          <div id="steps"></div>
          <button class="btn-ghost small" id="add-step">+ PASSO</button>

          <div class="editor-actions">
            <button class="btn-solid" id="save-preset">SALVAR</button>
            <button class="btn-ghost" id="new-preset">LIMPAR / NOVO</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section id="audio-mixer">
    <div class="editor-inner">
      <h2><span class="tag">AUDIO</span> Mixer de Som</h2>

      <div id="audio-channels" class="mixer-channels"></div>

      <h3>Graves / Agudos</h3>
      <div id="audio-eq"></div>

      <h3>Voz</h3>
      <div id="audio-voice"></div>

      <h3>Efeitos</h3>
      <div id="audio-sounds" class="audio-sounds-grid"></div>
      <div class="audio-add-sound">
        <input id="audio-sound-name" placeholder="Nome (ex: Buzina)" />
        <input id="audio-sound-path" placeholder="Caminho do arquivo (opcional se usar atalho)" />
        <input id="audio-sound-keybind" placeholder="Atalho do Discord (opcional, ex: ctrl+1)" />
        <button class="btn-ghost small" id="audio-sound-add">+ SOM</button>
      </div>

      <div class="editor-actions">
        <button class="btn-ghost" id="audio-mixer-close">FECHAR</button>
      </div>
    </div>
  </section>

  <div id="toast"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
